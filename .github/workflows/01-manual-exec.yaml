# CI de Nível 01 - Disparo Manual através de clique

# nome da pipeline
name: "Execução Manual"

# gatilhos / triggers - regras de disparo
# gatilho manual = workflow_dispatch

on:
    workflow_dispatch:

#tarefas dentro da pipeline = jobs

jobs:
    #nome do job
    e2e-tests:
        # maquina onde o job vai rodar
        runs-on: ubuntu-latest

        # passos do job
        steps:
            # clone do projeto
            - uses: actions/checkout@v4

            # instalção do node
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.x

            # instalação do Yarn
            - name: Instalando Yarn
              run: npm install -g yarn
            
            #   instalação das dependências
            - name: Instalando dependências
              run: yarn
            
            # instalação dos Browsers do Playwright
            - name: Instalando Browsers do Playwright
              run: yarn playwright install
            
            # executar os testes e2e
            - name: Executando testes e2e
              run: yarn run e2e --reporter=html

            # publicar o relatório HTML como artefato da execução
            # action escolhida no Marketplace: actions/upload-artifact
            # essa action permite anexar arquivos gerados pela pipeline, como relatórios de testes
            # if: always() garante que o relatório será publicado mesmo se algum teste falhar
            - name: Publicando relatório HTML dos testes
              uses: actions/upload-artifact@v7.0.1
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7